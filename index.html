<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FulusApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0f0e; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 420px; padding: 16px; padding-bottom: 80px; }
    .balance-card { background: linear-gradient(135deg, #0ba360 0%, #16c77a 100%); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
    .balance-header { display: flex; justify-content: space-between; font-size: 14px; opacity: 0.9; }
    .balance-card h1 { font-size: 32px; margin: 12px 0 16px 0; font-weight: 700; }
    .withdraw-btn { background-color: #ffffff; color: #0b9e59; border: none; border-radius: 12px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .streak-card { background-color: #171a1c; border-radius: 20px; padding: 16px; margin-bottom: 16px; }
    .streak-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .streak-title { display: flex; align-items: center; gap: 10px; }
    .fire-icon { background-color: #2b211a; padding: 8px; border-radius: 10px; font-size: 18px; }
    .streak-header h3 { font-size: 15px; }
    .streak-header p { font-size: 12px; color: #8a8e94; }
    .streak-count { text-align: right; font-size: 20px; font-weight: bold; }
    .total-days { display: block; font-size: 11px; color: #8a8e94; }
    .days-container { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .day-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .circle { width: 34px; height: 34px; background-color: #23272a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #aaa; }
    .day-item.active .circle { border: 2px solid #16c77a; color: #16c77a; }
    .day-item small { font-size: 10px; color: #8a8e94; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: #8a8e94; margin-bottom: 6px; }
    .progress-bar { background-color: #24292d; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { background-color: #16c77a; width: 0%; height: 100%; transition: width 0.3s; }
    .reward-notice { background-color: #152720; border: 1px solid #1c3b2f; color: #16c77a; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
    .checkin-btn { width: 100%; background-color: #16c77a; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: #121517; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #202428; }
    .nav-item { background: none; border: none; color: #8a8e94; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 2px; }
    .nav-item.active { color: #16c77a; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="balance-card">
      <div class="balance-header">
        <span>Available Balance</span>
        <span>💳</span>
      </div>
      <h1 id="balance-display">ETB 0.00</h1>
      <button class="withdraw-btn" onclick="alert('Withdrawal feature coming soon!')">Withdraw ↗</button>
    </div>

    <div class="streak-card">
      <div class="streak-header">
        <div class="streak-title">
          <span class="fire-icon">🔥</span>
          <div>
            <h3>Daily Streak</h3>
            <p>Keep earning every day</p>
          </div>
        </div>
        <div class="streak-count">
          <span id="streak-days">0</span>
          <span class="total-days">/ 7 days</span>
        </div>
      </div>

      <div class="days-container">
        <div class="day-item active"><span class="circle">1</span><small>2 ETB</small></div>
        <div class="day-item"><span class="circle">2</span><small>4 ETB</small></div>
        <div class="day-item"><span class="circle">3</span><small>5 ETB</small></div>
        <div class="day-item"><span class="circle">4</span><small>7 ETB</small></div>
        <div class="day-item"><span class="circle">5</span><small>9 ETB</small></div>
        <div class="day-item"><span class="circle">6</span><small>11 ETB</small></div>
        <div class="day-item"><span class="circle">7</span><small>12 ETB</small></div>
      </div>

      <div class="progress-section">
        <div class="progress-labels">
          <span>Progress</span>
          <span id="progress-text">0 / 50 ETB</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="reward-notice">
        <span>🎁 Earn <strong>2 ETB</strong> on your next check-in.</span>
      </div>

      <button class="checkin-btn" id="checkin-btn" onclick="handleCheckIn()">Check In</button>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active"><span>🏠</span><small>Home</small></button>
      <button class="nav-item"><span>📋</span><small>Tasks</small></button>
      <button class="nav-item"><span>💼</span><small>Wallet</small></button>
      <button class="nav-item"><span>ℹ️</span><small>Info</small></button>
    </nav>
  </div>

  <script>
    let balance = 0;
    let streak = 0;
    function handleCheckIn() {
      if (streak >= 7) {
        alert('የ 7 ቀናት ዙር ጨርሰዋል!');
        return;
      }
      streak += 1;
      balance += 2;
      document.getElementById('balance-display').innerText = 'ETB ' + balance.toFixed(2);
      document.getElementById('streak-days').innerText = streak;
      document.getElementById('progress-text').innerText = balance + ' / 50 ETB';
      document.getElementById('progress-fill').style.width = (balance / 50 * 100) + '%';
      alert('እንኳን ደስ አለዎት! 2 ETB አግኝተዋል።');
    }
  </script>
</body>
</html>
