<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FulusApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary-color: #2ea043;
            --text-color: #ffffff;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --danger-color: #da3633;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 8px 0;
            align-self: flex-start;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .task-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .task-info {
            text-align: left;
        }

        .task-title {
            font-size: 14px;
            font-weight: 600;
        }

        .task-reward {
            font-size: 12px;
            color: var(--primary-color);
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0d1117;
            color: white;
            box-sizing: border-box;
        }

        .msg-box {
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Balance Card -->
        <div class="card">
            <div class="balance-title">ጠቅላላ ሂሳብ</div>
            <div class="balance-amount"><span id="balance">0.00</span> ETB</div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="invites">0</div>
                <div class="stat-label">የተጋበዙ ሰዎች</div>
            </div>
            <div class="stat-card">
                <div class="stat-val">3 ETB</div>
                <div class="stat-label">በአንድ ግብዣ</div>
            </div>
        </div>

        <!-- Tasks Section -->
        <div class="section-title">ስራዎች (Tasks)</div>
        <div class="task-item">
            <div class="task-info">
                <div class="task-title">ይፋዊ ቻናላችንን ተቀላቀሉ</div>
                <div class="task-reward">+5.00 ETB</div>
            </div>
            <button class="btn" style="width: auto;" id="channelBtn" onclick="verifyChannel()">ተቀላቀል</button>
        </div>

        <!-- Referral Section -->
        <div class="section-title">ጓደኞችን መጋበዣ</div>
        <div class="card">
            <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 10px 0;">
                ጓደኞችህን በመጋበዝ ለእያንዳንዱ ሰው 3 ብር አግኝ!
            </p>
            <button class="btn" onclick="shareReferral()">የመጋበዣ ሊንክ አጋራ</button>
        </div>

        <!-- Withdraw Section -->
        <div class="section-title">ብር ማውጣት (Withdraw)</div>
        <div class="card">
            <div class="input-group">
                <label>የክፍያ ዘዴ</label>
                <select id="withdrawMethod">
                    <option value="Telebirr">Telebirr</option>
                    <option value="CBE">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
                </select>
            </div>
            <div class="input-group">
                <label>ስልክ ቁጥር / የባንክ ሂሳብ</label>
                <input type="text" id="withdrawPhone" placeholder="09xxxxxxxx">
            </div>
            <div class="input-group">
                <label>የብር መጠን (ዝቅተኛው 60 ETB)</label>
                <input type="number" id="withdrawAmount" placeholder="60">
            </div>
            <button class="btn" onclick="submitWithdraw()">ብር አውጣ</button>
            <div id="withdrawMsg" class="msg-box"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Render ላይ የሰራው ሰርቨር ሊንክ
        const API_BASE = "https://my-mini-app-sekv.onrender.com";

        const user = tg.initDataUnsafe?.user || { id: 12345678, first_name: "Demo User" };

        function fetchUserData() {
            fetch(`${API_BASE}/api/user?id=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                    document.getElementById('invites').innerText = data.invites || 0;
                })
                .catch(err => console.log(err));
        }

        function verifyChannel() {
            const btn = document.getElementById('channelBtn');
            btn.innerText = "በማረጋገጥ ላይ...";
            btn.disabled = true;

            fetch(`${API_BASE}/api/check_channel`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_id: user.id,
                    channel: "@PlusTechHub"
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "joined") {
                    alert("🎉 እንኳን ደስ አለህ! ቻናሉን ስለተቀላቀልክ 5 ETB ተጨምሮልሃል።");
                    btn.innerText = "ተጠናቋል ✓";
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                } else {
                    alert("⚠️ እባክዎ መጀመሪያ ቻናሉን ይቀላቀሉ!");
                    window.open("https://t.me/PlusTechHub", "_blank");
                    btn.innerText = "አረጋግጥ";
                    btn.disabled = false;
                }
            })
            .catch(() => {
                btn.innerText = "እንደገና ሞክር";
                btn.disabled = false;
            });
        }

        function shareReferral() {
            const refLink = `https://t.me/plustech_cash_bot?start=ref_${user.id}`;
            const shareText = encodeURIComponent(`🎉 FulusApp ላይ ስራዎችን በመስራት እና ሰዎችን በመጋበዝ ገንዘብ ያግኙ! አሁኑኑ ይቀላቀሉ፦ ${refLink}`);
            window.open(`https://t.me/share/url?url=${refLink}&text=${shareText}`, '_blank');
        }

        function submitWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const phone = document.getElementById('withdrawPhone').value.trim();
            const method = document.getElementById('withdrawMethod').value;
            const msgBox = document.getElementById('withdrawMsg');

            if (!amount || amount < 60) {
                msgBox.style.color = "var(--danger-color)";
                msgBox.innerText = "ዝቅተኛው የማውጫ መጠን 60 ETB ነው!";
                return;
            }

            if (!phone) {
                msgBox.style.color = "var(--danger-color)";
                msgBox.innerText = "እባክዎ ስልክ ቁጥር ያስገቡ!";
                return;
            }

            msgBox.style.color = "var(--text-secondary)";
            msgBox.innerText = "በማስተናገድ ላይ...";

            fetch(`${API_BASE}/api/withdraw`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_id: user.id,
                    amount: amount,
                    phone: phone,
                    method: method
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    msgBox.style.color = "var(--primary-color)";
                    msgBox.innerText = "ጥያቄዎ ተልኳል! አድሚኑ አረጋግጦ ይልክልዎታል።";
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                    document.getElementById('withdrawAmount').value = "";
                    document.getElementById('withdrawPhone').value = "";
                } else {
                    msgBox.style.color = "var(--danger-color)";
                    msgBox.innerText = data.message || "ስህተት ተፈጥሯል!";
                }
            })
            .catch(() => {
                msgBox.style.color = "var(--danger-color)";
                msgBox.innerText = "የኔትወርክ ስህተት ተፈጥሯል!";
            });
        }

        fetchUserData();
    </script>
</body>
</html>
